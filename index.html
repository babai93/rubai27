        <script>
    const profileCard = document.querySelector('.profile-card');
    if (profileCard) {
      profileCard.addEventListener('click', event => {
        if (event.target.closest('a')) {
          return;
        }
        profileCard.classList.toggle('flipped');
      });
    }
  </script>
