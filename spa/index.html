<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayarani · Spa & Retreat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Finlandica+Headline:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        @font-face {
            font-family: 'SymphonieCalligraphy';
            src: url('/fonts/SymphonieCalligraphyDEMO-Regular.otf') format('opentype');
            font-display: swap;
            font-weight: normal;
            font-style: normal;
        }

        .saira-subtitle {
            font-family: "Saira", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            font-variation-settings:
                "wdth" 100;
        }

        .finlandica-headline-circle {
            font-family: "Finlandica Headline", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        :root {
            --cream: #f8f5dc;
            --navy-dark: #0e1a40;
            --navy-mid: #182254;
            --navy-light: #1e2d6b;
            --gold: #d4b96a;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: radial-gradient(ellipse at 60% 30%, #1e2d6b 0%, #182254 40%, #0e1a40 100%);
            font-family: 'Georgia', serif;
            color: var(--cream);
            min-height: 100vh;
        }

        /* ── NAV ── */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 60px;
            position: relative;
            z-index: 10;
        }

        .nav-left {
            display: flex;
            gap: 48px;
            list-style: none;
            flex: 1;
        }

        .nav-left a {
            color: var(--cream);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .nav-left a:hover {
            opacity: 1;
        }

        .nav-logo {
            font-family: 'SymphonieCalligraphy', cursive;
            font-size: 42px;
            color: var(--cream);
            line-height: 1;
            flex: 0 0 auto;
            padding: 0 40px;
            text-shadow: 0 2px 20px rgba(248, 245, 220, 0.15);
        }

        .nav-right {
            display: flex;
            gap: 48px;
            list-style: none;
            flex: 1;
            justify-content: flex-end;
        }

        .nav-right a {
            color: var(--cream);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .nav-right a:hover {
            opacity: 1;
        }

        /* ── HERO ── */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 30px;
            position: relative;
        }

        .hero-wordmark {
            font-family: 'SymphonieCalligraphy', cursive;
            font-size: clamp(110px, 14vw, 210px);
            color: var(--cream);
            line-height: 0.85;
            text-align: center;
            text-shadow:
                0 4px 60px rgba(248, 245, 220, 0.12),
                0 0 120px rgba(248, 245, 220, 0.06);
            animation: fadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: 0.1s;
            letter-spacing: -0.01em;
            position: relative;
            z-index: 2;
        }

        .hero-subtitle {
            font-size: 13px;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            color: var(--cream);
            opacity: 0.78;
            /* margin-top: 10px; */
            animation: fadeDown 1.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: 0.3s;
            margin-left: 300px;
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-80px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── THREE CIRCLES ── */
        .circles-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 50px 60px 10px;
            animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: 0.5s;
        }

        .circle {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Left circle — welcome text */
        .circle-welcome {
            background: var(--cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 34px;
            text-align: center;
        }

        .asterisk {
            font-size: 52px;
            color: var(--navy-mid);
            margin-bottom: 14px;
            line-height: 1;
        }

        .welcome-title {
            font-size: 14px;
            font-family: "Finlandica Headline", sans-serif;
            letter-spacing: 0.48em;
            text-transform: uppercase;
            color: var(--navy-mid);
            margin-bottom: 12px;
        }

        .welcome-body {
            font-size: 9px;
            font-family: "Finlandica Headline", sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--navy-mid);
            line-height: 1.75;
            opacity: 0.75;
            text-align: justify;
            text-align-last: center;
            /* centers the final short line */
        }

        /* Centre circle — photo */
        .circle-photo {
            position: relative;
        }

        .circle-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        /* Right circle — rotating text */
        .circle-badge {
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .badge-asterisk {
            font-size: 155px;
            color: var(--navy-mid);
            position: absolute;
            z-index: 2;
            margin-top: 50px;
        }

        .badge-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            animation: rotateBadge 18s linear infinite;
        }

        @keyframes rotateBadge {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .badge-ring svg {
            width: 100%;
            height: 100%;
        }

        .badge-ring text {
            font-size: 20px;
            letter-spacing: 0.62em;
            fill: var(--navy-mid);
            font-family: "Finlandica Headline", sans-serif;
            text-transform: uppercase;
        }

        /* ── SUBTLE GLOW ── */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30, 45, 107, 0.6) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ═══════════════════════════════════════
           MOBILE STYLES  (≤ 768px)
        ═══════════════════════════════════════ */
        @media (max-width: 768px) {

            /* ── Mobile Nav ── */
            nav {
                flex-direction: column;
                align-items: center;
                padding: 20px 24px 14px;
                gap: 10px;
            }

            .nav-logo {
                font-size: 36px;
                padding: 0;
                order: -1;
            }

            .nav-left,
            .nav-right {
                flex: unset;
                justify-content: center;
                gap: 20px;
                flex-wrap: wrap;
            }

            .nav-left a,
            .nav-right a {
                font-size: 9px;
                letter-spacing: 0.18em;
            }

            /* ── Mobile Hero ── */
            .hero {
                padding: 10px 0 20px;
            }

            .hero-wordmark {
                font-size: clamp(72px, 22vw, 110px);
            }

            .hero-subtitle {
                font-size: 10px;
                letter-spacing: 0.4em;
                margin-left: 60px;
                margin-top: 6px;
            }

            /* ── Mobile Circles ── */
            .circles-row {
                flex-direction: column;
                align-items: center;
                gap: 28px;
                padding: 20px 24px 40px;
            }

            .circle {
                width: 220px;
                height: 220px;
            }

            .circle-photo {
                width: 240px;
                height: 240px;
            }

            /* Scale badge asterisk for smaller circle */
            .badge-asterisk {
                font-size: 120px;
                margin-top: 38px;
            }

            .badge-ring text {
                font-size: 17px;
                letter-spacing: 0.42em;
            }

            .asterisk {
                font-size: 26px;
                margin-bottom: 10px;
            }

            .welcome-title {
                font-size: 10px;
                letter-spacing: 0.22em;
                margin-bottom: 10px;
            }

            .welcome-body {
                font-size: 8.5px;
                text-align: justify;
                text-align-last: center;
            }

            /* ── Very small phones (≤ 390px) ── */
            @media (max-width: 390px) {
                .hero-wordmark {
                    font-size: clamp(60px, 20vw, 90px);
                }

                .hero-subtitle {
                    margin-left: 40px;
                }

                .circle {
                    width: 190px;
                    height: 190px;
                }

                .circle-photo {
                    width: 210px;
                    height: 210px;
                }

                .badge-asterisk {
                    font-size: 100px;
                    margin-top: 32px;
                }
            }
        }
    </style>
</head>

<body>

    <nav>
        <ul class="nav-left saira-subtitle">
            <li><a href="/home.html">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Gallery</a></li>
        </ul>
        <!-- <div class="nav-logo">Maharani</div> -->
        <ul class="nav-right saira-subtitle">
            <li><a href="#">Contact</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Search</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1 class="hero-wordmark">Mayarani</h1>
        <p class="hero-subtitle saira-subtitle">Spa &amp; Retreat</p>
    </section>

    <div class="circles-row">

        <!-- Left: Welcome -->
        <div class="circle circle-welcome">
            <div class="asterisk">*</div>
            <div class="welcome-title">· Welcome ·</div>
            <p class="welcome-body">
                Step into a sanctuary of<br>
                serenity, where every<br>
                detail is designed to<br>
                restore balance to your<br>
                body and mind.
            </p>
        </div>

        <!-- Centre: Photo -->
        <div class="circle circle-photo">
            <div class="circle image-circle">
                <img src="elegant.png" alt="Spa">
            </div>
        </div>

        <!-- Right: Badge -->
        <div class="circle circle-badge">
            <span class="badge-asterisk">*</span>
            <div class="badge-ring">
                <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <path id="textCircle" d="M 130,130
               m -95,0
               a 95,95 0 1,1 190,0
               a 95,95 0 1,1 -190,0" />
                    </defs>
                    <text>
                        <textPath href="#textCircle" startOffset="0%">
                            YOUR DESTINATION FOR PURE
                        </textPath>
                    </text>
                </svg>
            </div>
        </div>

    </div>

</body>

</html>
